<!doctype html><html><head><meta charset="utf-8"><title>tgctl logs</title><link rel="icon" href="/favicon.svg">
<style>
  html{color-scheme:dark} body{margin:0;background:#1b1d23;color:#d6d8de;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
  header{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#22242c;border-bottom:1px solid #30333e}
  header img{width:22px;height:22px} header b{color:#fff} input{flex:1;background:#1b1d23;color:#fff;border:1px solid #3d414d;border-radius:6px;padding:4px 8px;font:inherit}
  button{background:#2d303a;color:#dfe2ea;border:1px solid #3d414d;border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
  button.q{color:#ff8a8a;border-color:#6a3030}
  table{border-collapse:collapse;width:100%} td{padding:3px 16px;border-bottom:1px solid #22242c;white-space:nowrap} tr:hover{background:#22242c}
  a{color:#d6d8de;text-decoration:none} a:hover{color:#fff}
  .s{font-size:11px;font-weight:bold;padding:1px 8px;border-radius:10px;text-transform:uppercase}
  .ok{color:#1b1d23;background:#5fd36b}.fail{color:#fff;background:#d94848}.run{color:#1b1d23;background:#f5c542}
  .dim{color:#7c8090}
  th{text-align:left;padding:8px 16px 4px 32px;color:#aab;font-weight:normal;border-bottom:1px solid #30333e}
  th.day{padding:22px 16px 4px;color:#fff;font-weight:bold;font-size:15px;border-bottom:2px solid #3d414d}
  td:first-child{padding-left:32px}
</style></head><body>
<header><img src="/favicon.svg" alt=""><b>tgctl logs</b><input id="q" type="search" placeholder="filter (space = AND)" autofocus><span id="n" class="dim"></span>
<button class="q" onclick="fetch('/quit').then(()=>{document.body.innerHTML='<p style=padding:20px>tgctl server stopped — you can close this tab.</p>'})">Quit server</button></header>
<table id="t"></table>
<script>
let all=[];const q=document.getElementById('q');
function show(){const w=q.value.toLowerCase().split(/\s+/).filter(Boolean);const rows=all.filter(l=>w.every(x=>l.path.toLowerCase().includes(x)));
  document.getElementById('n').textContent=rows.length+'/'+all.length;
  const parse=l=>{const p=l.path.split('/'),f=p.pop(),br=p.pop(),act=p.pop(),day=p.splice(-3).join('-');return{...l,f,br,act,day,unit:p.join('/')}};
  const r=rows.map(parse).sort((a,b)=>b.day.localeCompare(a.day)||a.act.localeCompare(b.act)||b.f.localeCompare(a.f));
  let d='',g='';document.getElementById('t').innerHTML=r.map(l=>{let h='';
    if(l.day!==d){d=l.day;g='';h+='<tr><th class="day" colspan=4>'+d+'</th></tr>'}
    if(l.act!==g){g=l.act;h+='<tr><th colspan=4>'+g.replace('_',' ')+'</th></tr>'}
    return h+'<tr><td><span class="s '+l.status+'">'+l.status+'</span></td><td><a href="/view?p='+encodeURIComponent(l.path)+'">'+l.f+'</a></td><td class="dim">'+l.unit+'</td><td class="dim">'+l.br+'</td></tr>'}).join('')}
q.oninput=show;
fetch('/list').then(r=>r.json()).then(j=>{all=j;show()});
</script></body></html>
